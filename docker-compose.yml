services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: chat-crm-app-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
      - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:3000/chat}
    restart: unless-stopped
