# USO INDIVIDUAL (solo front en Vite) - no es el stack del día a día.
# El stack completo (API + front + IA + infra en una orden) vive en la raíz:
#   ../../docker-compose.dev.yml   ->  docker compose -f ../../docker-compose.dev.yml up --build -d
#
# Arranque individual:
#   cp .env.example .env     # VITE_API_URL / VITE_SOCKET_URL (solo 1ra vez)
#   docker compose up --build -d
#   docker compose down
#
# Nota: si la API no corre en el mismo Docker project, el navegador necesita la API
# publicada en localhost:3000 (usa el compose de chat-crm-api o el global de la raíz).
# VITE_* aquí salen de interpolación sobre .env del repo; en el compose global NO se
# declaran y manda el .env del bind mount.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      # Shared contracts (single source of truth lives in the API repo).
      additional_contexts:
        contracts: ../chat-crm-api/src/contracts
    container_name: chat-crm-dev-app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Volumen con nombre: sobrevive a `down` (con anónimo cada down = npm ci otra vez).
      - app_node_modules:/app/node_modules
      # Contracts are read live (Vite resolves CONTRACTS_DIR) so contract edits
      # hot-reload without rebuilding the image.
      - ../chat-crm-api/src/contracts:/workspace-contracts:ro
    environment:
      - NODE_ENV=development
      - CONTRACTS_DIR=/workspace-contracts
      # The bind mount would leave a container-path tsconfig.contracts.json
      # behind on the host.
      - CONTRACTS_TSCONFIG_DISABLE=1
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
      # /chat es el namespace canónico del gateway; /whatsapp quedó stale.
      - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:3000/chat}
    restart: unless-stopped

volumes:
  app_node_modules:
    driver: local
