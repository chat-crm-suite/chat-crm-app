# Producción: imagen nginx (target production).
# Las VITE_* se bakean en build -> pasar por --build-arg o .env.prod
# Uso en servidor:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up --build -d
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      # Shared contracts (single source of truth lives in the API repo).
      additional_contexts:
        contracts: ../chat-crm-api/src/contracts
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    container_name: chat-crm-app-prod
    ports: !override
      - "${APP_PORT:-8081}:80"
    volumes: !override []
    restart: unless-stopped
    networks:
      - crm-network

networks:
  crm-network:
    name: crm-network
    driver: bridge
